[project]
name = "dagster_learning"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.30",
    "dagster-duckdb>=0.29.30",
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_learning"
registry_modules = [
    "dagster_learning.components.*",
]


